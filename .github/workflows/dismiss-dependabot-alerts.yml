name: dismiss-dependabot-alerts
on:
  workflow_dispatch:
  schedule:
    - cron: "15 06 * * 1"
  push:
    branches:
      - master
    paths:
      - ".github/dismiss-alerts.yml"
      - ".github/workflows/dismiss-dependabot-alerts.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}
jobs:
  dismiss-alerts:
    name: dismiss-alerts
    runs-on: ubuntu-latest
    steps:
      - name: "Create Token"
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          app-id: ${{ vars.WORKFLOW_UPDATE_APP_ID }}
          private-key: ${{ secrets.WORKFLOW_UPDATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name}}
      - name: "Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          token: ${{ steps.app-token.outputs.token }}
      - name: "Dismiss alerts"
        id: dismiss-alerts
        uses: quotidian-ennui/actions-olio/dismiss-dependabot-alerts@b297584a2aef0a4136c4bff54c639d468e9f6a30 # v1.3.7
        with:
          token: ${{ steps.app-token.outputs.token }}
          dismissal_file: .github/dismiss-alerts.yml
